# GoogLeNet (Inception v1) + FPN + CBAM
#
# GENERATED by src/generate_necks.py -- do not edit by hand.
# Neck width 128, 2 neck pass(es).
#
# Width and pass count are shared with the matching BiFPN configuration,
# so the only difference between those two arms is the fusion topology.
#
# CBAM here is the open-gate variant bound in src/lib_modules.py: its gates
# start uniform and open rather than as a random mask, so appending it to a
# pretrained network does not corrupt the features on the first forward pass.
#
# Backbone is torchvision googlenet with ImageNet weights, taken through
# TVBackbone so its classifier head, and any auxiliary classifier branch,
# are removed before the children are run as a sequence.
# Pyramid levels, measured at 640 px: 480ch at index 7, 832ch at index 13, 1024ch at index 16.
# Everything after the backbone is new, which is what the warm-up phase in
# src/05_train.py exists to settle.

nc: 1

backbone:
  # [from, repeats, module, args]
  - [-1, 1, TVBackbone, [512, googlenet, 2]] # 0 backbone
  - [0, 1, Index, [480, 7]] # 1 P3/8
  - [0, 1, Index, [832, 13]] # 2 P4/16
  - [0, 1, Index, [1024, 16]] # 3 P5/32

head:
  - [1, 1, Conv, [128, 1, 1]] # 4 P3 lateral
  - [2, 1, Conv, [128, 1, 1]] # 5 P4 lateral
  - [3, 1, Conv, [128, 1, 1]] # 6 P5 lateral
  - [6, 1, nn.Upsample, [None, 2, "nearest"]] # 7
  - [[7, 5], 1, Concat, [1]] # 8
  - [-1, 1, Conv, [128, 3, 1]] # 9 P4 out (pass 1)
  - [9, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[10, 4], 1, Concat, [1]] # 11
  - [-1, 1, Conv, [128, 3, 1]] # 12 P3 out (pass 1)
  - [6, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[13, 9], 1, Concat, [1]] # 14
  - [-1, 1, Conv, [128, 3, 1]] # 15 P4 out (pass 2)
  - [15, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[16, 12], 1, Concat, [1]] # 17
  - [-1, 1, Conv, [128, 3, 1]] # 18 P3 out (pass 2)
  - [18, 1, CBAM, [128]] # 19
  - [15, 1, CBAM, [128]] # 20
  - [6, 1, CBAM, [128]] # 21
  - [[19, 20, 21], 1, Detect, [nc]] # 22
